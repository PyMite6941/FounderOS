name: FoundersOS
options:
  bundleIdPrefix: com.isabellawu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    FOUNDEROS_API_BASE_URL: "http://127.0.0.1:8000"
    # Personal Team (free provisioning). Team id only — never put an Apple ID
    # or email in this file: the repository is public.
    # Required for automatic signing / running on a physical device.
    DEVELOPMENT_TEAM: "FXNYZLP43Q"
    CODE_SIGN_STYLE: Automatic

targets:
  FoundersOS:
    type: application
    platform: iOS
    sources:
      - path: FoundersOS
        excludes:
          - "**/*.xcassets/AppIcon.appiconset"
    resources:
      - path: FoundersOS/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: FoundersOS/Info.plist
        # Unique to this team. "com.foundersos.app" is already registered to
        # another Apple account and can never be claimed.
        PRODUCT_BUNDLE_IDENTIFIER: com.isabellawu.foundersos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true

  FoundersOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoundersOSTests
    dependencies:
      - target: FoundersOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isabellawu.foundersos.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FoundersOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FoundersOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FoundersOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FoundersOSUITests
    dependencies:
      - target: FoundersOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isabellawu.foundersos.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FoundersOS
