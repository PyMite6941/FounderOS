name: Android CI/CD

on:
  push:
    branches: [main]
    paths:
      - "androidUI/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "androidUI/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      buildable: ${{ steps.android-project.outputs.buildable }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for a Gradle Android project
        id: android-project
        run: |
          if [ -x androidUI/gradlew ] && \
            { [ -f androidUI/settings.gradle ] || [ -f androidUI/settings.gradle.kts ]; } && \
            { [ -f androidUI/app/build.gradle ] || [ -f androidUI/app/build.gradle.kts ]; }; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android source files are present, but the Gradle project and wrapper are missing; build and APK upload are skipped."
          fi

      - name: Set up JDK 17
        if: steps.android-project.outputs.buildable == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK and run tests
        if: steps.android-project.outputs.buildable == 'true'
        run: |
          ./gradlew assembleDebug testDebugUnitTest --no-daemon
        working-directory: androidUI

      - name: Upload debug APK
        if: steps.android-project.outputs.buildable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: androidUI/app/build/outputs/apk/debug/*.apk

  release:
    needs: ci
    if: github.ref == 'refs/heads/main' && needs.ci.outputs.buildable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release bundle
        run: ./gradlew bundleRelease --no-daemon
        working-directory: androidUI

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: androidUI/app/build/outputs/bundle/release/*.aab
